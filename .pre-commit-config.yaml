minimum_pre_commit_version: "3.7.0"
default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-ast
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-xml
      - id: check-merge-conflict
      - id: debug-statements

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: ruff format --check --diff .
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-check
        name: ruff check (all Python)
        entry: ruff check .
        language: system
        pass_filenames: false
        always_run: true

      - id: pyright
        name: pyright
        entry: python3 scripts/run_pyright.py
        language: system
        pass_filenames: false
        always_run: true

      - id: biome
        name: Biome (website JavaScript and CSS)
        entry: npm run lint:web
        language: system
        pass_filenames: false
        always_run: true

      - id: html-validate
        name: html-validate (source and generated website)
        entry: python3 scripts/lint_html.py
        language: system
        pass_filenames: false
        always_run: true

      - id: native-compile-lint
        name: strict native compiler checks
        entry: python3 scripts/lint_native.py
        language: system
        pass_filenames: false
        always_run: true

      - id: xml-lint
        name: XML and SVG well-formedness
        entry: python3 scripts/lint_xml.py
        language: system
        pass_filenames: false
        always_run: true

      - id: lint-coverage
        name: source lint coverage
        entry: python3 scripts/check_lint_coverage.py
        language: system
        pass_filenames: false
        always_run: true

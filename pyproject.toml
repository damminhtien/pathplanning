[build-system]
requires = ["setuptools>=69,<70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pathplanning"
version = "0.2.0"
description = "Production-oriented search-based and sampling-based path planning algorithms with reusable Python API."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "damminhtien" }]
keywords = ["path-planning", "rrt", "astar", "motion-planning", "robotics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "numpy>=1.23,<3.0",
]

[project.optional-dependencies]
dev = [
  "pyright==1.1.414",
  "ruff==0.17.0",
  "pytest",
  "build>=1.2,<2.0",
  "scipy>=1.9,<2.0",
  "setuptools>=69,<70",
  "typing-extensions; python_version<'3.11'",
]
pyrr = ["pyrr>=0.10,<1.0"]
scipy = ["scipy>=1.9,<2.0"]
viz = ["matplotlib>=3.7,<4.0", "SciencePlots>=2.0,<3.0"]
geometry = ["shapely>=2.0,<3.0"]

[project.urls]
Homepage = "https://github.com/damminhtien/pathplanning"
Source = "https://github.com/damminhtien/pathplanning"
Issues = "https://github.com/damminhtien/pathplanning/issues"

[tool.setuptools.packages.find]
include = [
  "pathplanning*",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
pathplanning = ["py.typed", "THIRD_PARTY_NOTICES.md"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "cp3??t-* *-musllinux_* *-win*"
test-command = "python {project}/scripts/verify_wheel_install.py"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Cover syntax/style correctness, common bug patterns, and safe modernization
# across every Python file in the repository.
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = [
  "pathplanning",
]
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
# These scripts intentionally adjust sys.path before importing the checkout.
"scripts/analyze_benchmark_datasets.py" = ["E402"]
"scripts/benchmark_continuous_scaling.py" = ["E402"]
"scripts/benchmark_movingai_grid_specialists.py" = ["E402"]
"scripts/benchmark_native_sampling.py" = ["E402"]
"scripts/benchmark_planners.py" = ["E402"]
"scripts/benchmark_prm_roadmap_build.py" = ["E402"]
"scripts/benchmark_scaling.py" = ["E402"]
"scripts/benchmark_shortest_path.py" = ["E402"]
"scripts/benchmark_trace_overhead.py" = ["E402"]
"scripts/generate_movingai_scenario_assets.py" = ["E402"]
"scripts/install_benchmark_datasets.py" = ["E402"]
# This test selects the headless backend before importing the visualization API.
"tests/test_visualization.py" = ["E402"]
# P, E, O, and T are established geometric property names for this box type.
"pathplanning/spaces/environment3d.py" = ["E743"]
# Keep script-style planner modules runnable while preserving import ordering checks.
"pathplanning/planners/search/*.py" = ["E402"]
"pathplanning/planners/sampling/*.py" = ["E402"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
markers = [
  "slow: longer-running integration/contract tests excluded from the default unit target",
  "packaging: distribution build and wheel/sdist metadata checks",
]

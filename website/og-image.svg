<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f9fe"/>
      <stop offset=".55" stop-color="#e8f2fb"/>
      <stop offset="1" stop-color="#dceafa"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d669f"/>
      <stop offset=".55" stop-color="#3d82be"/>
      <stop offset="1" stop-color="#7388c1"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#648bb2" stroke-opacity=".16"/>
      <circle cx="0" cy="0" r="1.3" fill="#648bb2" fill-opacity=".23"/>
    </pattern>
    <filter id="glow" x="-.4" y="-.4" width="1.8" height="1.8">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="32" fill="url(#bg)"/>
  <rect x="22" y="22" width="1156" height="586" rx="25" fill="none" stroke="#6685a5" stroke-opacity=".25"/>
  <circle cx="1018" cy="175" r="260" fill="#91bde4" fill-opacity=".18"/>
  <circle cx="1125" cy="575" r="260" fill="#9ca8d2" fill-opacity=".14"/>
  <rect x="650" y="68" width="475" height="487" rx="22" fill="url(#grid)" stroke="#6d8fb3" stroke-opacity=".3"/>
  <g fill="#b6cce1" stroke="#6687a7" stroke-opacity=".55">
    <rect x="773" y="68" width="42" height="152" rx="8"/>
    <rect x="773" y="325" width="42" height="230" rx="8"/>
    <rect x="905" y="68" width="42" height="95" rx="8"/>
    <rect x="905" y="267" width="42" height="105" rx="8"/>
    <rect x="1038" y="223" width="42" height="128" rx="8"/>
  </g>
  <path d="M691 470H738V246H864Q891 246 891 219V215H1002L1048 180 1094 164" fill="none" stroke="#3e7eb4" stroke-opacity=".2" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M691 470H738V246H864Q891 246 891 219V215H1002L1048 180 1094 164" fill="none" stroke="url(#mint)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="11 13"/>
  <circle cx="691" cy="470" r="13" fill="#3979b4"/>
  <circle cx="1094" cy="164" r="12" fill="#c98743" stroke="#fffaf1" stroke-width="2"/>
  <g transform="translate(969 197) rotate(-38)">
    <rect x="-18" y="-13" width="36" height="26" rx="7" fill="#4a8abe" stroke="#f5fbff" stroke-width="2"/>
    <path d="M2-13 14-27v14" fill="none" stroke="#f5fbff" stroke-width="3"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="78" y="120" fill="#3475ad" font-size="17" font-weight="700" letter-spacing="4">PATHPLANNING LEARNING LAB</text>
    <text x="76" y="245" fill="#1b3048" font-family="Georgia,Times New Roman,serif" font-size="59" font-weight="500" letter-spacing="-3">Motion planning,</text>
    <text x="76" y="316" fill="url(#mint)" font-family="Georgia,Times New Roman,serif" font-size="59" font-weight="500" letter-spacing="-3">made visible.</text>
    <text x="80" y="372" fill="#506981" font-family="Georgia,Times New Roman,serif" font-size="23">Explore autonomous agents through interactive demos.</text>
    <g fill="#405c78" font-size="16" font-weight="600">
      <text x="80" y="472">37 PLANNERS</text>
      <text x="250" y="472">4 PROBLEM FAMILIES</text>
      <text x="477" y="472">EVALUATION METHODS</text>
    </g>
    <path d="M80 499H560" stroke="#6688a9" stroke-opacity=".25"/>
    <text x="80" y="539" fill="#6c8197" font-size="15">Search, sampling, time, and multi-agent coordination</text>
  </g>

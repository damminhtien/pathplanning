  <path d="M691 470H738V246H864Q891 246 891 219V215H1002L1048 180 1094 164" fill="none" stroke="url(#mint)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="11 13"/>

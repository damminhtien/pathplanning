name: Build wheels and publish to PyPI

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_existing_release:
        description: Upload only new wheel files to the existing PyPI version
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-wheels:
    name: Wheels on ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: macos-15-intel
            label: macos-x86_64
          - os: macos-14
            label: macos-arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build wheels and test clean installs
        uses: pypa/cibuildwheel@v4.3.1
        with:
          output-dir: wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: pathplanning-dist-${{ matrix.label }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 7

  build-sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build source distribution
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --outdir dist

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: pathplanning-dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  validate-distributions:
    name: Validate release files
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          pattern: pathplanning-dist-*
          path: dist
          merge-multiple: true

      - name: Check wheel matrix and package metadata
        run: |
          python -m pip install --upgrade twine
          python scripts/verify_wheelhouse.py dist
          python -m twine check dist/*

      - name: Match package version to release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")
          if version != tag_version:
              raise SystemExit(f"release tag {tag_version!r} does not match package version {version!r}")
          PY

  publish:
    name: Publish validated distributions to PyPI
    needs: validate-distributions
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_existing_release &&
       github.ref == 'refs/heads/main')
    environment: pypi-release
    runs-on: ubuntu-latest
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v4
        with:
          pattern: pathplanning-dist-*
          path: dist
          merge-multiple: true

      - name: Prepare upload files
        run: |
          mkdir upload
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            cp dist/*.whl upload/
          else
            cp dist/* upload/
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.8.14
        with:
          packages-dir: upload
          password: ${{ secrets.PYPI_API_TOKEN }}
